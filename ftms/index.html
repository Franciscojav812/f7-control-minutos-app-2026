<style>
/* Identidad compartida con la app de minutos (mismos colores, fuentes y piezas) */
:root{--ink:#0b0b12;--panel:#161622;--line:#2b2b42;--chalk:#f3f1f6;--mute:#9a98b0;--turf:#ec2f93;--bench:#1a2260;--benchl:#8da0f0;--blue2:#3a4fb8;--amber:#f4b53f;--red:#f25c5c;--green:#3ddc97;--blue:#5aa9ff;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
/* color por sección: igual que en la app de minutos */
body{--acc:#8da0f0;--top:#1b2670}
body[data-sec=setup],body[data-sec=carga]{--acc:#8da0f0;--top:#1b2670}
body[data-sec=match],body[data-sec=plan]{--acc:#ec2f93;--top:#4a1442}
body[data-sec=hist],body[data-sec=inicio]{--acc:#f4b53f;--top:#3b2b0b}
body[data-sec=ana],body[data-sec=post]{--acc:#3ddc97;--top:#0e3a2d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:linear-gradient(180deg,var(--top) 0,var(--ink) 300px) var(--ink) no-repeat;color:var(--chalk);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
main{max-width:28rem;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:var(--disp);font-style:italic;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:3rem;line-height:1}
#app>h1::after{content:"";display:block;width:56px;height:5px;border-radius:5px;background:var(--acc);margin:8px 0 6px}
h2{font-size:1.875rem;margin:24px 0 8px;color:var(--acc)}
h3{font-size:1.35rem;margin:14px 0 6px}
p{margin:6px 0}
.mute{color:var(--mute)}.small{font-size:.875rem}.xs{font-size:.75rem}.b{font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:52px;border-radius:16px;padding:0 14px;background:var(--bench);font-weight:700}
.btn.pri{background:var(--turf);color:var(--ink)}
.btn.ok{background:var(--green);color:var(--ink)}
.btn.w{width:100%}
.chip{min-height:44px;padding:0 14px;border-radius:999px;background:var(--bench);border:2px solid var(--blue2);font-weight:700;font-size:.9rem;color:var(--chalk)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.inp{width:100%;min-height:48px;border-radius:12px;background:var(--ink);border:1px solid var(--line);padding:0 12px;color:var(--chalk);font-size:1rem}
.inp:focus{outline:none;border-color:var(--turf)}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
label.f{display:block;color:var(--mute);font-size:.875rem;margin-top:8px}
label.f>.inp{margin-top:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.t-ok{background:var(--green);color:var(--ink)}.t-pend{background:var(--amber);color:var(--ink)}.t-mute{background:var(--bench);color:var(--benchl)}
.res{display:inline-block;min-width:58px;text-align:center;padding:3px 10px;border-radius:999px;font-weight:700;color:var(--ink)}
.res.G{background:var(--turf)}.res.E{background:var(--amber)}.res.P{background:var(--red)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.d-rojo{background:var(--red)}.d-ambar{background:var(--amber)}.d-verde{background:var(--green)}.d-bajo{background:var(--blue)}.d-portero{background:var(--mute)}.d-nd{background:var(--line)}
.bar{height:6px;border-radius:6px;background:var(--ink);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%}
.item{border-left:4px solid var(--line);padding:10px 12px;background:var(--panel);border-radius:12px;margin:8px 0}

/* cabecera idéntica a la de la app de minutos */

.app-kicker{font:700 12px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.team-t{font-family:var(--disp);font-style:italic;font-weight:700;font-size:1.875rem;line-height:1.05}
.hbtn{flex:none;margin-left:auto;display:flex;align-items:center;gap:4px;height:44px;padding:0 12px;border-radius:12px;background:var(--bench);border:1px solid var(--line);color:var(--benchl);font-weight:700;font-size:.875rem;text-decoration:none}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(22,22,34,.95);border-top:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));display:grid;grid-template-columns:repeat(4,1fr);max-width:28rem;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:60;background:var(--chalk);color:var(--ink);font-weight:700;padding:8px 16px;border-radius:999px;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
/* campo y camisetas: los mismos que en la app de minutos */
.pitch{position:relative;border-radius:28px;padding:22px 4px 16px;overflow:hidden;background:repeating-linear-gradient(180deg,#1e8f4d 0 46px,#198044 46px 92px);box-shadow:inset 0 0 0 3px rgba(238,243,236,.55),0 10px 30px rgba(34,163,90,.18)}
.pitch::before{content:"";position:absolute;left:50%;top:-46px;width:92px;height:92px;margin-left:-46px;border:3px solid rgba(238,243,236,.45);border-radius:50%}
.pitch::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:70px;border:3px solid rgba(238,243,236,.45);border-bottom:0}
.prow{position:relative;z-index:1;display:flex;justify-content:space-around;margin-bottom:18px}
.prow:last-child{margin:0}
.pl{display:flex;flex-direction:column;align-items:center;width:31%;max-width:108px;min-width:0}
.jersey{display:grid;place-items:center;flex:none;width:54px;height:54px;border-radius:16px 16px 22px 22px;font:italic 700 28px var(--disp);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.jersey.red{background:linear-gradient(90deg,#ec2f93 0 17%,#14141c 17% 83%,#ec2f93 83%);color:#ff4fae;box-shadow:inset 0 5px 0 #ec2f93,0 4px 0 rgba(0,0,0,.3)}
.jersey.amb{background:var(--amber);color:var(--ink)}
.pl .nm{margin-top:5px;max-width:100%;padding:1px 9px;border-radius:99px;background:rgba(12,20,17,.82);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .ps{font:italic 700 14px var(--disp);text-shadow:0 1px 3px #000;margin-top:2px}
.over{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(180deg,#4a1442 0,var(--ink) 300px) var(--ink) no-repeat;padding-top:env(safe-area-inset-top)}
.over main{padding-bottom:40px}
.big{font-size:1.25rem;font-weight:700}
.cons{counter-reset:c;list-style:none;padding:0;margin:0}
.cons li{counter-increment:c;display:flex;gap:10px;align-items:flex-start;font-size:1.25rem;font-weight:700;margin:10px 0}
.cons li::before{content:counter(c);flex:none;width:36px;height:36px;border-radius:12px;background:var(--turf);color:var(--ink);display:grid;place-items:center;font:italic 700 1.3rem var(--disp)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
th{color:var(--mute);font-weight:600;border-top:0}
td:first-child,th:first-child{text-align:left}
.num{font-variant-numeric:tabular-nums}
details>summary{cursor:pointer;font-weight:700}
.ficha table td:first-child{color:var(--mute);width:96px;vertical-align:top}.ficha td{text-align:left}
a{color:var(--turf)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
'use strict';
/* ==========================================================
   FTMS · Football Tactical & Methodological Suite · Fase 1
   Club San José del Parque · Fútbol 7
   - LEE (nunca escribe) los datos de la app de minutos: localStorage 'f7minutos.club.v2'
   - Guarda lo suyo en 'ftms.v1'
   ========================================================== */
const SRC_KEY='f7minutos.club.v2',KEY='ftms.v1',VER=1;
const TEAMS={pre:{name:'Prebenjamín A',half:20,cat:'pre'},ale:{name:'Alevín B',half:25,cat:'ale'}};
const CATS={
 pre:{n:'Prebenjamín',foco:'Formar antes que ganar. Reparto orientativo del entrenamiento: 40 % coordinación, 50 % técnico-táctico y 10 % juego. Prioridad: pase, control y conducción. Un objetivo por sesión, explicaciones muy breves y por imitación.'},
 ale:{n:'Alevín',foco:'Reparto orientativo: 25 % coordinación, 50 % técnico-táctico y 25 % juego. Ganan peso el regate, el remate, la protección y las acciones defensivas. Uno o dos objetivos por sesión; empezar a explicar el porqué.'}};

/* ---- Sistemas de fútbol 7 (los mismos 8 de la app de minutos). formato:'F7' deja sitio para añadir F11 ---- */
const SIS={
 '3-2-1':{fmt:'F7',car:'Equilibrado',idea:'Tres defensas y dos medios: siempre hay apoyos por detrás del balón.',fu:['Vigilancia tras pérdida con 3 por detrás','Salida de balón con varias opciones'],de:['Poca gente en el área rival','El delantero se queda solo si los medios no llegan']},
 '3-1-2':{fmt:'F7',car:'Equilibrado',idea:'Tres atrás, un medio y dos puntas.',fu:['Dos delanteros para presionar la salida rival','Línea de 3 sólida'],de:['Un solo medio: el carril central se abre tras pérdida','Distancias largas entre defensa y ataque']},
 '2-2-2':{fmt:'F7',car:'Ofensivo',idea:'Bloques de dos en cada línea.',fu:['Muchos jugadores cerca del área rival','Parejas fáciles de entender'],de:['Solo 2 defensas: sufre en contraataques','Bandas defensivas descubiertas']},
 '2-3-1':{fmt:'F7',car:'Muy ofensivo',idea:'Línea de tres medios por delante de dos defensas.',fu:['Dominio del centro del campo','Muchas líneas de pase'],de:['Espalda de los medios muy expuesta','Exige mucho esfuerzo de vuelta']},
 '1-3-2':{fmt:'F7',car:'Ofensivo',idea:'Un solo defensa, tres medios y dos puntas.',fu:['Mucha gente para atacar y presionar'],de:['Un defensa para todo: cualquier pérdida es peligrosa']},
 '4-1-1':{fmt:'F7',car:'Defensivo',idea:'Cuatro defensas, un medio y un punta.',fu:['Área propia muy protegida','Defiende bien centros y bandas'],de:['Cuesta llegar arriba','El punta y el medio quedan aislados']},
 '2-1-3':{fmt:'F7',car:'Muy ofensivo',idea:'Tres delanteros por delante de un medio.',fu:['Presión alta con tres jugadores','Mucha presencia en área rival'],de:['Muy expuesto en transición defensiva','Un solo medio para cerrar el centro']},
 '3-3-0':{fmt:'F7',car:'Defensivo',idea:'Sin delantero fijo: tres atrás y tres medios.',fu:['Superioridad en el centro','Difícil de superar por dentro'],de:['Nadie fija a los defensas rivales','Pocos tiros']}};
const DL={1:['DFC'],2:['DFC','DFC'],3:['LI','DFC','LD'],4:['LI','DFC','DFC','LD']},ML={0:[],1:['MC'],2:['MC','MC'],3:['MI','MC','MD']},FL={0:[],1:['DC'],2:['EI','ED'],3:['EI','DC','ED']};
Object.keys(SIS).forEach(k=>{const[d,m,f]=k.split('-').map(Number),S=SIS[k],r=(s,n)=>Array.from({length:n},(_,i)=>s+i);
 S.lab=['Portero',...DL[d],...ML[m],...FL[f]];S.rows=[r(1+d+m,f),r(1+d,m),r(1,d),[0]].filter(x=>x.length);S.d=d;S.m=m;S.f=f});
const OFENS=k=>SIS[k]&&/fensivo/.test(SIS[k].car)&&SIS[k].car!=='Defensivo';

/* ---- opciones del formulario post-partido ---- */
const ZONAS=['Izquierda','Centro','Derecha'];
const PERD=['Salida','Medio','Ataque','Sin pérdida'];
const RANG=['0','1-2','3-5','6+'];
const PRES=['Baja','Media','Alta'];
const RAT=[['salida','Salida de balón','salida'],['ptp','Reacción tras pérdida','transicion'],['repliegue','Ayudas y repliegue','repliegue'],['espacios','Crear y ocupar espacios','espacios'],['final','Finalización','finalizacion'],['actitud','Actitud y comunicación','actitud']];

/* ---- utilidades ---- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pctS=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const fdate=d=>{try{return new Date(d).toLocaleDateString('es-ES')}catch(e){return''}};
const ymd=d=>{try{return new Date(d).toLocaleDateString('sv-SE')}catch(e){return''}};
const C=(cat,pre,ale)=>cat==='pre'?pre:ale;
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ---- estado propio ---- */
function loadState(){
 let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!s||s.ver!==VER)s={ver:VER};
 s.team=TEAMS[s.team]?s.team:'pre';s.tab=['inicio','post','plan','carga'].includes(s.tab)?s.tab:'inicio';
 s.post=s.post||{};s.plans=s.plans||{};s.imported=s.imported||null;
 s.cfg=Object.assign({win:3,red:85,amber:70,low:35},s.cfg||{});
 return s;
}
let ST=loadState(),SEL=null,OVER=null;
function save(){try{const o=Object.assign({},ST);localStorage.setItem(KEY,JSON.stringify(o))}catch(e){toast('⚠ No se pudo guardar: almacenamiento lleno. Exporta una copia FTMS.')}}

/* ==========================================================
   CONECTOR (solo lectura)
   ========================================================== */
function readSrc(){
 try{const raw=localStorage.getItem(SRC_KEY);if(raw){const a=JSON.parse(raw);if(a&&a.teams)return{all:a,origen:'directo'}}}catch(e){}
 if(ST.imported&&ST.imported.all&&ST.imported.all.teams)return{all:ST.imported.all,origen:'importado'};
 return{all:null,origen:null};
}
function normG(g,i){
 const acts=Array.isArray(g.acts)?g.acts:(g.shots||[]).map(s=>({k:'tiro',lado:s.lado,res:s.res,part:s.part,min:s.min,add:s.add||0,t:s.t||0}));
 return{id:String(g.id),n:i+1,date:g.date,rival:g.rival||'',jornada:g.jornada||'',comp:g.comp||'',loc:g.loc||'',total:+g.total||0,half:+g.half||0,gf:g.gf,gc:g.gc,sis:g.sis||'',
  sg:Array.isArray(g.sg)?g.sg:[],players:(g.players||[]).map(x=>({id:String(x.id),name:String(x.name||''),pos:String(x.pos||''),ms:+x.ms||0,titular:!!x.titular})),acts};
}
function team(id){
 const {all,origen}=readSrc();if(!all||!all.teams[id])return null;const t=all.teams[id];
 return{id,origen,cat:TEAMS[id].cat,half:TEAMS[id].half,enJuego:!!t.match,
  players:(t.players||[]).map(p=>({id:String(p.id),name:String(p.name||''),pos:String(p.pos||''),conv:p.conv!==false})),
  history:(t.history||[]).map(normG)};
}
function nameOf(T,id){const p=T.players.find(p=>p.id===id);if(p)return p.name;for(const g of T.history){const x=g.players.find(q=>q.id===id);if(x)return x.name}return'?'}
function short(T,id){
 if(!id)return'';const n=nameOf(T,id).trim(),[f,...r]=n.split(/\s+/);
 const dup=T.players.filter(p=>p.name.trim().split(/\s+/)[0]===f).length>1;
 return dup&&r.length?f+' '+r[0][0]+'.':f;
}
const pkey=(T,g)=>T.id+':'+g.id;
const formOf=(T,g)=>ST.post[pkey(T,g)];
const gkey=a=>String(a.t!=null?a.t:(a.part+'-'+a.min+'-'+(a.add||0)));

/* ==========================================================
   SEÑALES DE UN PARTIDO
   ========================================================== */
function sig(T,g){
 const A=g.acts,c=f=>A.filter(f).length,isG=l=>a=>a.k==='tiro'&&a.lado===l&&a.res==='gol';
 const s={};
 s.gf=g.gf!=null?+g.gf:c(isG('favor'));s.gc=g.gc!=null?+g.gc:c(isG('contra'));
 s.tpf=c(a=>a.k==='tiro'&&a.lado==='favor'&&a.res!=='fuera');s.tpc=c(a=>a.k==='tiro'&&a.lado==='contra'&&a.res!=='fuera');
 s.tff=c(a=>a.k==='tiro'&&a.lado==='favor'&&a.res==='fuera');s.tfc=c(a=>a.k==='tiro'&&a.lado==='contra'&&a.res==='fuera');
 s.parp=c(a=>a.k==='tiro'&&a.lado==='contra'&&a.res==='parada');
 s.cf=c(a=>a.k==='corner'&&a.lado==='favor');s.cc=c(a=>a.k==='corner'&&a.lado==='contra');
 s.of=c(a=>a.k==='ocasion'&&a.lado==='favor');s.oc=c(a=>a.k==='ocasion'&&a.lado==='contra');
 s.tiros=s.tpf+s.tff;s.tirosC=s.tpc+s.tfc;
 s.golesC=A.filter(isG('contra')).sort((a,b)=>(a.t||0)-(b.t||0));s.golesF=A.filter(isG('favor'));
 s.causas={};s.golesC.forEach(a=>{const k=a.orig||'Sin anotar';s.causas[k]=(s.causas[k]||0)+1});
 s.origenes={};s.golesF.forEach(a=>{const k=a.orig||'Sin anotar';s.origenes[k]=(s.origenes[k]||0)+1});
 const half=g.half||T.half,late=a=>a.add>0||(a.part===1?a.min>half-5:a.min>2*half-5);
 s.lateC=s.golesC.filter(late).length;s.lateF=s.golesF.filter(late).length;s.half=half;
 const fld=g.players.filter(x=>x.pos!=='Portero').map(x=>x.ms/60000),mean=fld.reduce((a,b)=>a+b,0)/Math.max(1,fld.length);
 s.minMean=mean;s.minSd=Math.sqrt(fld.reduce((a,b)=>a+(b-mean)*(b-mean),0)/Math.max(1,fld.length));
 s.pocos=g.players.filter(x=>x.pos!=='Portero'&&x.ms/60000<mean*0.5);
 const sg=g.sg.slice().sort((a,b)=>b.ms-a.ms);s.sisMain=sg.length?sg[0].f:(g.sis.split(' | ')[0]||'');
 s.res=s.gf>s.gc?'G':s.gf===s.gc?'E':'P';
 return s;
}
/* media de temporada sin el partido indicado */
function base(T,g){
 const H=T.history.filter(x=>x.id!==g.id);if(H.length<2)return null;
 const S=H.map(x=>sig(T,x)),av=k=>S.reduce((a,s)=>a+s[k],0)/S.length;
 return{n:H.length,tiros:av('tiros'),tirosC:av('tirosC'),gf:av('gf'),gc:av('gc'),of:av('of'),oc:av('oc')};
}
/* rendimiento por sistema en la temporada (minutos jugados y goles) */
function sisTemp(T){

 T.history.forEach(g=>{g.sg.forEach(s=>{const x=o[s.f]=o[s.f]||{ms:0,gf:0,gc:0};x.ms+=s.ms});
  g.acts.forEach(a=>{if(a.k==='tiro'&&a.res==='gol'&&a.form){const x=o[a.form]=o[a.form]||{ms:0,gf:0,gc:0};x[a.lado==='favor'?'gf':'gc']++}})});
 return o;
}

function carga(T){
 const H=T.history,N=Math.max(1,+ST.cfg.win||3),last=H.slice(-N),prev=H.slice(-2*N,-N),tot=a=>a.reduce((s,g)=>s+g.total,0);
 return T.players.map(p=>{
  const ms=g=>{const x=g.players.find(q=>q.id===p.id);return x?x.ms:0},conv=g=>g.players.some(q=>q.id===p.id);
  const lt=tot(last),lm=last.reduce((s,g)=>s+ms(g),0),pct=lt?lm/lt*100:0;
  const pt=tot(prev),pp=prev.length&&pt?prev.reduce((s,g)=>s+ms(g),0)/pt*100:null;
  let full=0;for(let i=H.length-1;i>=0;i--){const g=H[i];if(g.total&&ms(g)>=g.total*0.95)full++;else break}
  const cn=H.filter(conv).length,sm=H.reduce((s,g)=>s+ms(g),0),gk=p.pos==='Portero';
  let st='verde';
  if(!last.length)st='nd';else if(gk)st='portero';else if(pct>=ST.cfg.red)st='rojo';else if(pct>=ST.cfg.amber)st='ambar';else if(pct<ST.cfg.low)st='bajo';
  return{p,pct,pp,full,convL:last.filter(conv).length,nL:last.length,cn,media:cn?sm/cn/60000:0,total:sm/60000,st};
 });
}

 <div class="row" style="margin:8px 0"><span class="tag t-mute">${esc(P.sis)}</span><span class="small mute">${esc(S.car)}</span></div>
 <div class="pitch">${S.rows.map(r=>`<div class="prow">${r.map(tok).join('')}</div>`).join('')}</div>
 <h2>Consignas</h2>${P.cons.some(x=>x.trim())?`<ol class="cons">${P.cons.filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="mute">Sin consignas. Añádelas en el Game Plan.</p>'}
 <h2>Balón parado</h2><div class="card"><div class="grid2 big" style="font-size:1.05rem">
  <div><span class="mute small">Córner a favor</span><br>${sh(P.abp.cf)}</div><div><span class="mute small">Faltas</span><br>${sh(P.abp.ff)}</div>
  <div><span class="mute small">Penalti</span><br>${sh(P.abp.pen)}</div><div></div>
  <div><span class="mute small">1er palo (en contra)</span><br>${sh(P.abp.m1)}</div><div><span class="mute small">2º palo</span><br>${sh(P.abp.m2)}</div>
  <div><span class="mute small">Rechace</span><br>${sh(P.abp.m3)}</div></div></div></main>`;
}
/* ---- Semáforo ---- */
function vCarga(T){
 const L=carga(T),ord={bajo:0,rojo:1,ambar:2,verde:3,portero:4,nd:5},cf=ST.cfg;
 let h=`<h1>Reparto</h1><p class="mute">Porcentaje de los minutos disputados por el equipo que ha jugado cada uno en los últimos ${cf.win} partidos.</p>
 <p class="small mute">En estas edades lo importante es que todos jueguen y aprendan. Esto no mide carga física: según la formación UEFA C, la condición física no se entrena de forma específica hasta infantil. Primero aparecen quienes juegan poco.</p>
 <div class="card small"><div class="row wrap">${Object.entries(STL).filter(([k])=>k!=='nd').map(([k,[e,t]])=>`<span>${e} ${t}</span>`).join(' · ')}</div>
 <details style="margin-top:8px"><summary>Ajustar umbrales</summary>
 <label class="f">Ventana (partidos)<select data-cfg="win" class="inp">${[2,3,4,5].map(v=>`<option ${+cf.win===v?'selected':''}>${v}</option>`).join('')}</select></label>
 <label class="f">🔴 desde (%)<input data-cfg="red" type="number" min="50" max="100" value="${cf.red}" class="inp"></label>
 <label class="f">🟠 desde (%)<input data-cfg="amber" type="number" min="30" max="100" value="${cf.amber}" class="inp"></label>
 <label class="f">🔵 por debajo de (%)<input data-cfg="low" type="number" min="0" max="80" value="${cf.low}" class="inp"></label></details></div>`;
 if(!T.history.length)return h+`<div class="card mute">Aún no hay partidos.</div>`;
 h+=L.sort((a,b)=>ord[a.st]-ord[b.st]||b.pct-a.pct).map(x=>{const col={rojo:'var(--red)',ambar:'var(--amber)',verde:'var(--green)',bajo:'var(--blue)',portero:'var(--mute)',nd:'var(--line)'}[x.st];
  const tr=x.pp==null?'':x.pct-x.pp>10?' ↑':x.pp-x.pct>10?' ↓':' →';
  return`<div class="card"><div class="row"><span class="dot d-${x.st}"></span><b class="grow">${esc(x.p.name)}</b><span class="num big">${Math.round(x.pct)}%<span class="small mute">${tr}</span></span></div>
  <div class="bar"><i style="width:${Math.min(100,x.pct)}%;background:${col}"></i></div>
  <div class="xs mute" style="margin-top:6px">${STL[x.st][1]} · convocado ${x.convL}/${x.nL} recientes · media ${x.media.toFixed(1)}' por convocatoria · ${Math.round(x.total)}' en la temporada${x.full>=2&&x.st!=='portero'?` · <b style="color:var(--amber)">${x.full} partidos seguidos completos</b>`:''}${x.p.conv?'':' · no convocado ahora'}</div></div>`}).join('');
 return h+`<p class="xs mute">↑ ↓ comparan con los ${cf.win} partidos anteriores. Un no convocado cuenta como 0 minutos: revisa el motivo antes de sacar conclusiones.</p>`;
}

/* ---- render ---- */
function render(){
 const T=team(ST.team);
 document.body.dataset.sec=ST.tab;
 const head=`<header class="top"><img src="../crest.jpg" alt="Escudo Club San José del Parque"><div class="grow"><div class="app-kicker">FTMS · Táctica</div><div class="team-t">${TEAMS[ST.team].name}</div><div class="mute small" style="font-weight:600">Club San José del Parque · Fútbol 7 · ${TEAMS[ST.team].half}×2 min</div></div><a href="../" class="hbtn" aria-label="Abrir la app de minutos">⏱ Minutos</a></header>
 <div class="teams">${Object.keys(TEAMS).map(id=>`<button data-a="team" data-id="${id}" class="${ST.team===id?'on':''}">${TEAMS[id].name}</button>`).join('')}</div>`;
 let v;
 if(!T&&ST.tab!=='inicio')v=`<h1>FTMS</h1>`+noData();
 else if(ST.tab==='inicio')v=vInicio(T);
 else if(ST.tab==='post'){const g=SEL&&T.history.find(x=>x.id===SEL);v=g?vPost(T,g):vPostList(T)}
 else if(ST.tab==='plan')v=vPlan(T);
 else v=vCarga(T);
 $('#app').innerHTML=head+v;
 $('#nav').innerHTML=[['inicio','🏠','Inicio'],['post','📝','Post-partido'],['plan','📋','Game Plan'],['carga','⚖️','Reparto']].map(([id,i,l])=>`<button data-a="tab" data-id="${id}" class="${ST.tab===id?'on':''}"><span>${i}</span>${l}</button>`).join('');
 $('#over').innerHTML=OVER&&T?`<div class="over">${vMatchView(T)}</div>`:'';
}

/* ==========================================================
   ACCIONES
   ========================================================== */
function form(T,g){const k=pkey(T,g);return ST.post[k]=ST.post[k]||{goles:{},rat:{},at:Date.now()}}
function csvQ(v){v=String(v==null?'':v);return /[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const csv=(H,R)=>'﻿'+[H.join(','),...R.map(r=>H.map(c=>csvQ(r[c])).join(','))].join('\r\n');
function allRows(fn){const R=[];Object.keys(TEAMS).forEach(id=>{const T=team(id);if(T)T.history.forEach(g=>{const F=formOf(T,g);if(F)fn(T,g,F,R)})});return R}
function exportPost(){
 const H=['equipo','partido_id','partido_n','fecha','rival','perdidas_salida','recuperaciones_altas','presion_rival','sistema_rival',...RAT.map(r=>'val_'+r[0]),'nota'];
 const R=allRows((T,g,F,R)=>R.push({equipo:TEAMS[T.id].name,partido_id:g.id,partido_n:g.n,fecha:ymd(g.date),rival:g.rival,perdidas_salida:F.perd||'',recuperaciones_altas:F.recu||'',presion_rival:F.presion||'',sistema_rival:F.sisR||'',...Object.fromEntries(RAT.map(r=>['val_'+r[0],(F.rat||{})[r[0]]||''])),nota:F.nota||''}));
 if(!R.length){toast('Aún no hay formularios');return}dl('ftms-postpartido.csv',csv(H,R),'text/csv');
}
function exportGol(){
 const H=['equipo','partido_id','partido_n','fecha','rival','parte','minuto','anadido','causa','zona','perdida_previa'];
 const R=allRows((T,g,F,R)=>sig(T,g).golesC.forEach(a=>{const x=(F.goles||{})[gkey(a)]||{};R.push({equipo:TEAMS[T.id].name,partido_id:g.id,partido_n:g.n,fecha:ymd(g.date),rival:g.rival,parte:a.part,minuto:a.min,anadido:a.add||0,causa:a.orig||'',zona:x.zona||'',perdida_previa:x.perdida||''})}));
 if(!R.length){toast('No hay goles en contra con formulario');return}dl('ftms-goles-contra.csv',csv(H,R),'text/csv');
}
function copyText(t){
 const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Charla copiada')}catch(e){toast('No se pudo copiar')}a.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Charla copiada'),fb);else fb();
}
let WL=null;
async function wake(on){try{if(on&&navigator.wakeLock)WL=await navigator.wakeLock.request('screen');else if(WL){await WL.release();WL=null}}catch(e){}}

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,id=b.dataset.id,T=team(ST.team);
 if(a==='tab'){ST.tab=id;SEL=null;scrollTo(0,0)}
 else if(a==='team'){ST.team=id;SEL=null}
 else if(a==='open'){ST.tab='post';SEL=id;scrollTo(0,0)}
 else if(a==='back'){SEL=null}
 else if(a==='fset'||a==='gset'){
  const g=T.history.find(x=>x.id===SEL);if(!g)return;const F=form(T,g),k=b.dataset.k,v=b.dataset.v;
  if(a==='gset'){const x=F.goles[b.dataset.g]=F.goles[b.dataset.g]||{};x[k]=x[k]===v?'':v}
  else if(k.startsWith('rat.')){const r=k.slice(4);F.rat[r]=+F.rat[r]===+v?0:+v}
  else F[k]=F[k]===v?'':v;
  F.at=Date.now();
 }
 else if(a==='fdel'){const g=T.history.find(x=>x.id===SEL);if(g&&confirm('¿Borrar el formulario de este partido?'))delete ST.post[pkey(T,g)]}
 else if(a==='copy'){const g=T.history.find(x=>x.id===id);if(g)copyText(informeTxt(T,g,formOf(T,g)||null));return}
 else if(a==='toPlan'){const g=T.history.find(x=>x.id===id);if(!g)return;const P=planOf(T),{R}=rules(T,g,formOf(T,g)||null),{m}=mejoras(T,R);
  let n=0;m.forEach(x=>{const i=P.cons.findIndex(c=>!c.trim());if(i>=0&&!P.cons.includes(x.charla)){P.cons[i]=x.charla.slice(0,90);n++}});
  toast(n?`${n} consigna${n>1?'s':''} añadida${n>1?'s':''} al Game Plan`:'No hay huecos libres en las consignas');ST.tab='plan';SEL=null}
 else if(a==='sugc'){const P=planOf(T),x=(vPlan.sugs||[])[+id];if(!x)return;const i=P.cons.findIndex(c=>!c.trim());if(i<0){toast('Las 3 consignas están ocupadas');return}P.cons[i]=x.slice(0,90)}
 else if(a==='pclear'){if(confirm('¿Empezar un plan nuevo? Se borra el plan actual de este equipo.'))delete ST.plans[T.id]}
 else if(a==='match'){OVER=true;wake(true);scrollTo(0,0)}
 else if(a==='closeM'){OVER=null;wake(false)}
 else if(a==='impMin'){$('#impMin').click();return}
 else if(a==='impFt'){$('#impFt').click();return}
 else if(a==='expFt'){dl('ftms-copia.json',JSON.stringify({app:'ftms',version:VER,exportado:new Date().toISOString(),post:ST.post,plans:ST.plans,cfg:ST.cfg},null,1),'application/json');return}
 else if(a==='csvPost'){exportPost();return}
 else if(a==='csvGol'){exportGol();return}
 save();render();
});
document.addEventListener('change',ev=>{
 const e=ev.target,T=team(ST.team);if(!T)return;
 if(e.dataset.f){const g=T.history.find(x=>x.id===SEL);if(!g)return;const F=form(T,g);F[e.dataset.f]=e.value;F.at=Date.now();save();if(e.tagName==='SELECT')render();return}
 const P=T&&planOf(T);
 if(e.dataset.p){P[e.dataset.p]=e.value;save();if(e.dataset.p==='sis')render();return}
 if(e.dataset.xi!=null){P.xi[+e.dataset.xi]=e.value;save();render();return}
 if(e.dataset.ab){P.abp[e.dataset.ab]=e.value;save();return}
 if(e.dataset.c!=null){P.cons[+e.dataset.c]=e.value.trim();save();return}
 if(e.dataset.cfg){const k=e.dataset.cfg,v=+e.value;if(!isFinite(v))return;ST.cfg[k]=v;save();render();return}
});
/* textos: guardar mientras se escribe sin repintar (no perder el foco) */
document.addEventListener('input',ev=>{
 const e=ev.target,T=team(ST.team);if(!T)return;
 if(e.dataset.f==='nota'){const g=T.history.find(x=>x.id===SEL);if(g){form(T,g).nota=e.value;save()}}
 else if(e.dataset.p==='rival'||e.dataset.p==='nota'){planOf(T)[e.dataset.p]=e.value;save()}
 else if(e.dataset.c!=null){planOf(T).cons[+e.dataset.c]=e.value;save()}
});
function readFile(input,cb){input.addEventListener('change',()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(x){toast('Archivo no válido')}input.value=''};r.readAsText(f)})}
readFile($('#impMin'),d=>{
 const all=d&&d.all&&d.all.teams?d.all:(d&&d.teams?d:null);
 if(!all){toast('No es una copia de la app de minutos');return}
 if(readSrc().origen==='directo'&&!confirm('Este navegador ya tiene los datos de la app de minutos y se seguirán usando esos. ¿Guardar igualmente la copia como respaldo?'))return;
 ST.imported={at:Date.now(),all};save();render();toast('Copia de la app de minutos importada');
});
readFile($('#impFt'),d=>{
 if(!d||d.app!=='ftms'||!d.post){toast('No es una copia del FTMS');return}
 if(!confirm('Se reemplazarán los formularios, planes y umbrales del FTMS por la copia. ¿Continuar?'))return;
 ST.post=d.post||{};ST.plans=d.plans||{};ST.cfg=Object.assign(ST.cfg,d.cfg||{});save();render();toast('Copia FTMS importada');
});
/* si la app de minutos guarda en otra pestaña, refrescar */
addEventListener('storage',e=>{if(e.key===SRC_KEY)render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();if(OVER)wake(true)}});
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));
render();
</script>
