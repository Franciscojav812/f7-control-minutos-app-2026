<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minutos F7">
<meta name="theme-color" content="#0b0b12">
<title>Minutos F7 · San José del Parque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">

<script>
tailwind.config={theme:{extend:{colors:{ink:'#0b0b12',panel:'#161622',line:'#2b2b42',turf:'#ec2f93',turfd:'#7a1450',chalk:'#f3f1f6',mute:'#9a98b0',amber:'#f4b53f',bench:'#1a2260',benchl:'#8da0f0'},fontFamily:{disp:['"Barlow Condensed"','Impact','sans-serif'],sans:['Barlow','system-ui','sans-serif']}}}}
</script>
<style>
html,body{height:100%;background:#0b0b12;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{padding-top:env(safe-area-inset-top);color:#eef3ec;font-family:Barlow,system-ui,sans-serif}
input{user-select:text;-webkit-user-select:text}
.num{font-variant-numeric:tabular-nums}
@keyframes pulse2{50%{box-shadow:0 0 0 6px rgba(244,181,63,.25)}}
.pulse{animation:pulse2 1.2s infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
body{background:linear-gradient(180deg,#1b2670 0,#0b0b12 280px) #0b0b12 no-repeat}
.score{border-radius:28px;padding:16px;background:linear-gradient(160deg,#16251e,#0b0b12);box-shadow:inset 0 0 0 2px rgba(236,47,147,.55),0 10px 30px rgba(236,47,147,.18)}
.pitch{position:relative;border-radius:28px;padding:22px 4px 16px;overflow:hidden;background:repeating-linear-gradient(180deg,#1e8f4d 0 46px,#198044 46px 92px);box-shadow:inset 0 0 0 3px rgba(238,243,236,.55),0 10px 30px rgba(34,163,90,.18)}
.pitch::before{content:"";position:absolute;left:50%;top:-46px;width:92px;height:92px;margin-left:-46px;border:3px solid rgba(238,243,236,.45);border-radius:50%}
.pitch::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:70px;border:3px solid rgba(238,243,236,.45);border-bottom:0}
.prow{position:relative;z-index:1;display:flex;justify-content:space-around;margin-bottom:18px}.prow:last-child{margin:0}
.tok{position:relative;display:flex;flex-direction:column;align-items:center;width:31%;max-width:108px;min-height:96px;transition:transform .15s}
.tok:active,.bcard:active{transform:scale(.95)}
.jersey{display:grid;place-items:center;flex:none;width:54px;height:54px;border-radius:16px 16px 22px 22px;font:700 28px 'Barlow Condensed',sans-serif;font-style:italic;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.jersey.red{background:linear-gradient(90deg,#ec2f93 0 17%,#14141c 17% 83%,#ec2f93 83%);color:#ff4fae;box-shadow:inset 0 5px 0 #ec2f93,0 4px 0 rgba(0,0,0,.3)}.jersey.amb{background:#f4b53f;color:#0b0b12}.jersey.blu{background:linear-gradient(160deg,#3a4fb8,#1d2c7a)}
.tag{margin-top:5px;max-width:100%;padding:1px 9px;border-radius:99px;background:rgba(12,20,17,.82);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font:700 16px 'Barlow Condensed',sans-serif;text-shadow:0 1px 3px #000}
.tok.sel .jersey{outline:3px solid #f4b53f;outline-offset:3px;animation:pulse2 1s infinite}
.out{position:absolute;top:-8px;right:4px;background:#f4b53f;color:#0b0b12;font:700 11px Barlow,sans-serif;padding:1px 7px;border-radius:99px}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.pop .jersey{animation:pop .45s}
.bcard{display:flex;align-items:center;gap:10px;padding:10px;min-height:76px;border-radius:20px;background:#1a2260;border:2px solid #3a4fb8;text-align:left;transition:transform .15s}
.bcard .jersey{width:44px;height:44px;font-size:24px}
.bcard.go{border-color:#f4b53f;animation:pulse2 1.2s infinite}
@media (prefers-reduced-motion:reduce){.tok.sel .jersey,.bcard.go,.pop .jersey{animation:none}}
.chip{min-height:44px;padding:0 14px;border-radius:999px;font-weight:700;background:#1a2260;border:2px solid #3a4fb8;color:#f3f1f6}
.chip.on{background:#f4b53f;color:#0b0b12;border-color:#f4b53f}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:448px;max-height:90vh;overflow:auto;background:#161622;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:3px solid #ec2f93}
.pl{position:absolute;top:-8px;left:2px;z-index:2;background:rgba(11,11,18,.85);font:700 11px Barlow,sans-serif;padding:1px 7px;border-radius:99px}
.tok{width:auto;flex:1 1 0}
</style>
</head>
<body>
<div id="app" class="max-w-md mx-auto px-4 pt-3" style="padding-bottom:calc(92px + env(safe-area-inset-bottom))"></div>
<nav class="fixed bottom-0 inset-x-0 bg-panel border-t border-line" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-md mx-auto grid grid-cols-3" id="nav"></div>
</nav>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bg-chalk text-ink font-semibold px-4 py-3 rounded-xl opacity-0 pointer-events-none transition-opacity z-50" style="bottom:calc(96px + env(safe-area-inset-bottom))"></div>

/* ---- estado: un bloque por equipo ---- */
function newTeam(id){
  const D=DEF[id],players=D.n.map((n,i)=>({id:'p'+(i+1),name:n,pos:D.p[n]||'',conv:true}));
  return{players,starters:players.slice(0,7).map(p=>p.id),match:null,history:[],nid:players.length+1,form:'3-2-1'};
}
function fixMatch(m,t){
  m.form=m.form||'3-2-1';m.form0=m.form0||m.form;m.roster=m.roster||t.players.map(p=>p.id);
  m.pm=m.pm||{};m.ps=m.ps||{...m.since};m.shots=m.shots||[];m.events=m.events||[];
  m.events.forEach(v=>{if(!v.k)v.k='sub';v.add=v.add||0});
  if(m.part===2&&m.p1End==null)m.p1End=m.half*60000;
}
function fixTeam(t,id){
  t.players.forEach(p=>{delete p.dorsal;if(p.conv===undefined)p.conv=true;if(p.pos===undefined)p.pos=''});
  t.form=t.form||'3-2-1';t.history=t.history||[];delete t.tab;delete t.half;
  if(t.match)fixMatch(t.match,t);
}
function load(){
  let a=null;try{a=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!a||!a.teams)a={cur:'pre',tab:'setup',teams:{}};
  Object.keys(TEAMS).forEach(id=>{
    if(!a.teams[id]){let t=null;try{t=JSON.parse(localStorage.getItem(id==='pre'?'f7minutos.v1':'f7minutos.alevinb.v1'))}catch(e){}
      a.teams[id]=t&&t.players?t:newTeam(id)}
    fixTeam(a.teams[id],id);
  });
  return a;
}
let ALL=load(),S=ALL.teams[ALL.cur],DLG=null;
const setTeam=id=>{ALL.cur=id;S=ALL.teams[id]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(ALL))}catch(e){}}
const pl=id=>S.players.find(p=>p.id===id);
function short(id){
  const p=pl(id);if(!p)return'?';
  const [f,...r]=p.name.trim().split(/\s+/);
  const dup=S.players.filter(q=>q.name.trim().split(/\s+/)[0]===f).length>1;
  return dup&&r.length?f+' '+r[0][0]+'.':f;
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1900)}

/* ---- tiempo, partes y minutos añadidos ---- */
const el=()=>{const m=S.match;return m.base+(m.running?Date.now()-m.runStart:0)};
const pm=id=>{const m=S.match;return(m.acc[id]||0)+(m.onField.includes(id)?el()-m.since[id]:0)};
const pause=()=>{const m=S.match;if(m.running){m.base=el();m.running=false}};
const lim=m=>m.part===1?m.half*60000:m.p1End+m.half*60000;
function mark(m,e){
  const H=m.half*60000;
  if(m.part===1)return e<H?{part:1,min:Math.floor(e/60000)+1,add:0}:{part:1,min:m.half,add:Math.floor((e-H)/60000)+1};
  const x=e-m.p1End;
  return x<H?{part:2,min:m.half+Math.floor(x/60000)+1,add:0}:{part:2,min:2*m.half,add:Math.floor((x-H)/60000)+1};
}
const mtxt=v=>v.add?`${v.min}+${v.add}'`:`${v.min}'`;
/* ---- posiciones ---- */
const lab=(m,i)=>FORMS[m.form].lab[i];
function stint(m,id,e){
  const i=m.onField.indexOf(id);if(i<0)return;
  const l=lab(m,i),o=m.pm[id]=m.pm[id]||{};
  o[l]=(o[l]||0)+(e-(m.ps[id]||0));m.ps[id]=e;
}
function assign(ids,form){
  const L=FORMS[form].lab,pos=id=>(pl(id)&&pl(id).pos)||'';
  const g=x=>x==='Portero'?'P':/^(DFC|LI|LD)$/.test(x)?'D':/^(MC|MI|MD)$/.test(x)?'M':'F';
  const res=Array(L.length).fill(null),rest=ids.slice();
  [(i,id)=>pos(id)===L[i],(i,id)=>pos(id)&&g(pos(id))===g(L[i]),()=>true].forEach(f=>L.forEach((_,i)=>{
    if(res[i])return;const id=rest.find(x=>f(i,x));if(id){res[i]=id;rest.splice(rest.indexOf(id),1)}}));
  return res;
}
function swapPos(m,a,b){
  const e=el(),i=m.onField.indexOf(a),j=m.onField.indexOf(b),la=lab(m,i),lb=lab(m,j);
  stint(m,a,e);stint(m,b,e);m.onField[i]=b;m.onField[j]=a;
  m.events.push({k:'pos',t:e,...mark(m,e),a,b,det:`${short(a)} ${la}→${lb} · ${short(b)} ${lb}→${la}`});
}
function changeForm(m,f){
  if(f===m.form)return;const e=el();m.onField.forEach(id=>stint(m,id,e));
  m.events.push({k:'sis',t:e,...mark(m,e),det:`${m.form} → ${f}`,to:f});m.form=f;S.form=f;
}
/* ---- marcador y sugerencias ---- */
const sc=m=>({f:m.shots.filter(s=>s.lado==='favor'&&s.res==='gol').length,c:m.shots.filter(s=>s.lado==='contra'&&s.res==='gol').length});
function suggest(m){
  const {f,c}=sc(m),d=f-c,left=(m.part===1?(lim(m)-el())+m.half*60000:lim(m)-el())/60000;
  let g,txt;
  if(d<=-2){g=['2-3-1','2-1-3','2-2-2'];txt=`Perdéis ${f}-${c}: toca arriesgar, sistemas muy ofensivos.`}
  else if(d===-1){g=['2-2-2','1-3-2'];txt=`Perdéis ${f}-${c}: más presión arriba, sistemas ofensivos.`}
  else if(d===0&&left<=5){g=['2-2-2','1-3-2'];txt=`Empate ${f}-${c} y queda poco: busca el gol con un sistema ofensivo.`}
  else if(d===0){g=['3-2-1','3-1-2'];txt=`Empate ${f}-${c}: sistema equilibrado.`}
  else if(d===1&&left>8){g=['3-2-1','3-1-2'];txt=`Ganáis ${f}-${c}: mantened el equilibrio.`}
  else{g=['4-1-1','3-3-0'];txt=`Ganáis ${f}-${c}: proteged la ventaja con un sistema defensivo.`}
  return{txt,g:g.filter(x=>x!==m.form)};
}

function evTxt(v){
  if(v.k==='part')return'Empieza la 2ª parte';
  const t=mtxt(v);
  if(v.k==='sub')return`${t} Entra ${short(v.entra)} por ${short(v.sale)}`;
  if(v.k==='pos')return`${t} Posición: ${v.det}`;
  if(v.k==='sis')return`${t} Sistema ${v.det}`;
  const a=v.autor?short(v.autor):'',as=v.asist?short(v.asist):'';
  if(v.lado==='favor')return v.res==='gol'?`${t} ⚽ GOL${a?' de '+a:''}${as?' (asist. '+as+')':''}`:`${t} Tiro a favor parado${a?' ('+a+')':''}`;
  return v.res==='gol'?`${t} Gol en contra${v.por?' (portero '+short(v.por)+')':''}`:`${t} Parada de ${v.por?short(v.por):'nuestro portero'}`;
}

function totals(){

  return names.map(n=>{const o={n,tot:0,gl:0,as:0,par:0,pos:{}};
    S.history.forEach(g=>{const x=g.players.find(y=>y.name===n);if(!x)return;o.tot+=x.ms;o.gl+=x.goles||0;o.as+=x.asist||0;o.par+=x.paradas||0;
      const pp=x.posMs||(x.pos?{[x.pos]:x.ms}:{});Object.entries(pp).forEach(([k,v])=>o.pos[k]=(o.pos[k]||0)+v)});return o});
}

  $('#app').innerHTML=`<header class="flex items-center gap-3 mb-3"><img src="${CREST}" alt="Escudo Club San José del Parque" class="w-14 h-14 rounded-full shrink-0 ring-2 ring-turf"><div class="leading-tight"><div class="font-disp text-3xl font-bold italic">${T.name}</div><div class="text-mute text-sm font-semibold">Club San José del Parque · Fútbol 7 · ${T.half}×2 min</div></div></header>
  <div class="grid grid-cols-2 gap-2 mb-4">`+Object.keys(TEAMS).map(id=>{const t=TEAMS[id],run=ALL.teams[id].match&&ALL.teams[id].match.running;
    return`<button data-a="team" data-id="${id}" class="min-h-12 rounded-2xl font-bold ${ALL.cur===id?'bg-turf text-ink':'bg-bench text-benchl'}">${t.name}${run?' ●':''}</button>`}).join('')+`</div>`+v+(DLG&&S.match?vDlg():'');
  if($('#newp'))$('#newp').value=keep;
  $('#nav').innerHTML=[['setup','📋 Plantilla'],['match','⚽ Partido'],['hist','🏆 Historial']].map(([id,l])=>
    `<button data-a="tab" data-id="${id}" class="min-h-16 font-bold text-lg ${ALL.tab===id?'text-turf':'text-mute'}">${l}${id==='match'&&S.match&&S.match.running?' ●':''}</button>`).join('');
  tick();
}
function tick(){
  const m=S.match;if(!m||ALL.tab!=='match')return;
  const e=el(),L=lim(m),st=m.part===1?0:m.p1End,over=e>L;
  const c=$('[data-t=clock]');if(c){c.textContent=fmt(e);c.style.color=over?'#f4b53f':''}
  const b=$('[data-t=bar]');if(b){b.style.width=Math.min(100,(e-st)/(m.half*60000)*100)+'%';b.style.background=over?'#f4b53f':''}
  const a=$('[data-t=add]');if(a)a.textContent=over?'+'+fmt(e-L)+' de tiempo añadido':'';
  const mn=$('[data-t=min]');if(mn)mn.textContent='Min '+mtxt(mark(m,e));
  document.querySelectorAll('[data-pm]').forEach(n=>n.textContent=fmt(pm(n.dataset.pm)));
}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
/* ---- final de partido ---- */
function finalize(rival,gf,gc){
  const m=S.match,e=el();pause();
  m.onField.forEach(id=>stint(m,id,e));
  const nm=id=>id&&pl(id)?pl(id).name:'',sh=m.shots,sb=m.events.filter(v=>v.k==='sub');
  const players=m.roster.map(id=>{
    const p=pl(id),pp=m.pm[id]||{},top=Object.entries(pp).sort((a,b)=>b[1]-a[1])[0];
    return{id,name:p.name,pos:top?top[0]:(p.pos||''),posMs:Object.fromEntries(Object.entries(pp).filter(([k,v])=>v>=500).map(([k,v])=>[k,Math.round(v)])),
      ms:Math.round(pm(id)),titular:m.starters.includes(id),entradas:sb.filter(v=>v.entra===id).length,salidas:sb.filter(v=>v.sale===id).length,
      goles:sh.filter(s=>s.lado==='favor'&&s.res==='gol'&&s.autor===id).length,asist:sh.filter(s=>s.lado==='favor'&&s.res==='gol'&&s.asist===id).length,
      paradas:sh.filter(s=>s.lado==='contra'&&s.res==='parada'&&s.por===id).length,encajados:sh.filter(s=>s.lado==='contra'&&s.res==='gol'&&s.por===id).length};
  });
  let mf=0,mc=0;
  const shots=sh.slice().sort((a,b)=>a.t-b.t).map(s=>{if(s.res==='gol'){if(s.lado==='favor')mf++;else mc++}
    return{part:s.part,min:s.min,add:s.add,lado:s.lado,res:s.res,autor:nm(s.autor),asist:nm(s.asist),por:nm(s.por),mf,mc}});
  const events=m.events.filter(v=>v.k!=='part').map(v=>({k:v.k,part:v.part,min:v.min,add:v.add||0,entra:nm(v.entra),sale:nm(v.sale),det:v.det||''}));
  const H=m.half*60000,a1=Math.max(0,(m.p1End!=null?m.p1End:e)-H),a2=m.p1End!=null?Math.max(0,e-m.p1End-H):0;
  const sis=[m.form0,...m.events.filter(v=>v.k==='sis').map(v=>v.to)].join(' | ');
  S.history.push({id:Date.now(),date:new Date().toISOString(),rival,total:e,half:m.half,gf,gc,add1:a1,add2:a2,sis,players,events,shots});
  S.match=null;ALL.tab='hist';
}
/* ---- exportación ---- */
const HD={
 d:['partido_n','partido_id','fecha','rival','duracion_min','jugador','posicion','titular','minutos','pct_partido','entradas','salidas','goles','asistencias','paradas','goles_encajados'],
 p:['partido_n','partido_id','fecha','rival','duracion_min','minutos_reloj','cambios','goles_favor','goles_contra','resultado','tiros_favor','tiros_contra','paradas_portero','paradas_rival','anadido_p1_min','anadido_p2_min','sistemas','convocados'],
 c:['partido_n','partido_id','tipo','parte','minuto','anadido','entra','sale','detalle'],
 e:['partido_n','partido_id','parte','minuto','anadido','lado','resultado','jugador','asistente','portero','marcador_favor','marcador_contra'],
 o:['partido_n','partido_id','jugador','posicion','minutos']};
function allPlayers(){
  const L=S.players.map(p=>({name:p.name,pos:p.pos}));
  S.history.forEach(g=>g.players.forEach(x=>{if(!L.some(p=>p.name===x.name))L.push({name:x.name,pos:x.pos})}));
  return L;
}
function rowsLong(){
  const R=[];
  S.history.forEach((g,i)=>g.players.forEach(x=>R.push({partido_n:i+1,partido_id:g.id,fecha:ymd(g),rival:g.rival||'',duracion_min:r1(g.total),jugador:x.name,posicion:x.pos||'',titular:x.titular?1:0,minutos:r1(x.ms),
    pct_partido:g.total?Math.round(x.ms/g.total*1000)/1000:0,entradas:x.entradas||0,salidas:x.salidas||0,goles:x.goles||0,asistencias:x.asist||0,paradas:x.paradas||0,goles_encajados:x.encajados||0})));
  return R;
}
function rowsPartidos(){
  return S.history.map((g,i)=>{const sh=g.shots||[],has=g.gf!=null;
    return{partido_n:i+1,partido_id:g.id,fecha:ymd(g),rival:g.rival||'',duracion_min:r1(g.total),minutos_reloj:r1(g.total),cambios:(g.events||[]).filter(v=>(v.k||'sub')==='sub').length,
      goles_favor:has?g.gf:'',goles_contra:has?g.gc:'',resultado:has?(g.gf>g.gc?'G':g.gf===g.gc?'E':'P'):'',tiros_favor:sh.filter(s=>s.lado==='favor').length,tiros_contra:sh.filter(s=>s.lado==='contra').length,
      paradas_portero:sh.filter(s=>s.lado==='contra'&&s.res==='parada').length,paradas_rival:sh.filter(s=>s.lado==='favor'&&s.res==='parada').length,
      anadido_p1_min:r1(g.add1||0),anadido_p2_min:r1(g.add2||0),sistemas:g.sis||'',convocados:g.players.length}});
}
const TIPO={sub:'sustitucion',pos:'posicion',sis:'sistema'};
const rowsCambios=()=>S.history.flatMap((g,i)=>(g.events||[]).map(v=>({partido_n:i+1,partido_id:g.id,tipo:TIPO[v.k||'sub'],parte:v.part,minuto:v.min,anadido:v.add||0,entra:v.entra||'',sale:v.sale||'',detalle:v.det||''})));
const rowsEventos=()=>S.history.flatMap((g,i)=>(g.shots||[]).map(s=>({partido_n:i+1,partido_id:g.id,parte:s.part,minuto:s.min,anadido:s.add||0,lado:s.lado,resultado:s.res,jugador:s.autor||'',asistente:s.asist||'',portero:s.por||'',marcador_favor:s.mf,marcador_contra:s.mc})));
const rowsPos=()=>S.history.flatMap((g,i)=>g.players.flatMap(x=>Object.entries(x.posMs||(x.pos?{[x.pos]:x.ms}:{})).map(([k,v])=>({partido_n:i+1,partido_id:g.id,jugador:x.name,posicion:k,minutos:r1(v)}))));
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCsv(){
  const R=rowsLong();if(!R.length){toast('Aún no hay partidos');return}
  const q=v=>{v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  dl(TEAMS[ALL.cur].c,'\ufeff'+[HD.d.join(','),...R.map(r=>HD.d.map(c=>q(r[c])).join(','))].join('\n'),'text/csv;charset=utf-8');
}
function exportJson(){dl('minutos-copia-completa.json',JSON.stringify({app:'minutos-f7',version:2,exportado:new Date().toISOString(),all:ALL},null,1),'application/json')}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('Excel no disponible sin conexión');return}
  if(!S.history.length){toast('Aún no hay partidos');return}
  const H=S.history,D=rowsLong(),P=allPlayers(),n=H.length,col=XLSX.utils.encode_col,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),M0=10;
  const A=[['Jugador','Posición','TOTAL MINUTOS','PROMEDIO / PTDO','% TIEMPO JUGADO','PARTIDOS','TITULAR','GOLES','ASIST.','PARADAS',...H.map((_,i)=>({t:'n',v:i+1,z:'"J"0'}))]];
  P.forEach((p,i)=>{
    const r=i+2,rs=D.filter(x=>x.jugador===p.name),tot=sum(rs,x=>x.minutos),pj=rs.filter(x=>x.minutos>0).length,dur=sum(rs,x=>x.duracion_min),k=`Datos!$F:$F,$A${r}`;
    A.push([p.name,p.pos||null,
      {t:'n',f:`SUMIFS(Datos!$I:$I,${k})`,v:tot},{t:'n',f:`IFERROR(C${r}/F${r},0)`,v:pj?tot/pj:0},
      {t:'n',f:`IFERROR(C${r}/SUMIFS(Datos!$E:$E,${k}),0)`,v:dur?tot/dur:0,z:'0.0%'},{t:'n',f:`COUNTIFS(${k},Datos!$I:$I,">0")`,v:pj},
      {t:'n',f:`SUMIFS(Datos!$H:$H,${k})`,v:sum(rs,x=>x.titular)},{t:'n',f:`SUMIFS(Datos!$M:$M,${k})`,v:sum(rs,x=>x.goles)},
      {t:'n',f:`SUMIFS(Datos!$N:$N,${k})`,v:sum(rs,x=>x.asistencias)},{t:'n',f:`SUMIFS(Datos!$O:$O,${k})`,v:sum(rs,x=>x.paradas)},
      ...H.map((g,j)=>{const x=rs.find(y=>y.partido_n===j+1);return x?{t:'n',f:`SUMIFS(Datos!$I:$I,${k},Datos!$A:$A,${col(M0+j)}$1)`,v:x.minutos}:null})]);
  });
  const body=A.slice(1),val=x=>x&&typeof x==='object'?x.v:(+x||0),T=['TOTAL EQUIPO',null];
  for(let c=2;c<M0+n;c++){const rg=`${col(c)}2:${col(c)}${P.length+1}`,av=c===3||c===4,s=body.reduce((a,r)=>a+val(r[c]),0);
    T.push({t:'n',f:`${av?'AVERAGE':'SUM'}(${rg})`,v:av?s/body.length:s,z:c===4?'0.0%':undefined})}
  A.push(T);
  const ws=XLSX.utils.aoa_to_sheet(A);
  ws['!cols']=[{wch:22},{wch:10},{wch:15},{wch:17},{wch:17},{wch:10},{wch:9},{wch:8},{wch:8},{wch:10},...H.map(()=>({wch:6}))];
  const wb=XLSX.utils.book_new(),add=(d,nm,h)=>XLSX.utils.book_append_sheet(wb,Array.isArray(d)?XLSX.utils.json_to_sheet(d,{header:h}):d,nm);
  add(ws,'Minutos Temporada');add(D,'Datos',HD.d);add(rowsPartidos(),'Partidos',HD.p);add(rowsCambios(),'Cambios',HD.c);add(rowsEventos(),'Eventos',HD.e);add(rowsPos(),'Posiciones',HD.o);
  XLSX.writeFile(wb,TEAMS[ALL.cur].x);
}
document.getElementById('imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(d.version===2&&d.all&&d.all.teams){
      if(!confirm('Se reemplazarán las plantillas y los historiales de LOS DOS equipos por la copia. ¿Continuar?'))return;
      ALL=d.all;Object.keys(TEAMS).forEach(id=>{if(!ALL.teams[id])ALL.teams[id]=newTeam(id);fixTeam(ALL.teams[id],id)});setTeam(TEAMS[ALL.cur]?ALL.cur:'pre');
    }else if(Array.isArray(d.players)&&Array.isArray(d.history)){
      if(S.match){toast('Termina el partido en curso antes de importar');return}
      if(!confirm('Se reemplazarán la plantilla y el historial de '+TEAMS[ALL.cur].name+' por la copia ('+d.history.length+' partidos). ¿Continuar?'))return;
      S.players=d.players;S.history=d.history;fixTeam(S,ALL.cur);S.starters=S.players.filter(p=>p.conv).slice(0,7).map(p=>p.id);
      S.nid=Math.max(0,...S.players.map(p=>+String(p.id).slice(1)||0))+1;
    }else throw 0;
    ALL.tab='hist';DLG=null;save();render();toast('Copia importada');
  }catch(x){toast('Archivo no válido')}};
  r.readAsText(f);e.target.value='';
});
/* ---- acciones ---- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled||/^(INPUT|SELECT)$/.test(b.tagName))return;
  const a=b.dataset.a,id=b.dataset.id,m=S.match;
  if(m)m.last=null;
  if(a==='tab'){ALL.tab=id;DLG=null}
  else if(a==='team'){setTeam(id);DLG=null}
  else if(a==='conv'){const p=pl(id);p.conv=!p.conv;if(!p.conv)S.starters=S.starters.filter(x=>x!==id)}
  else if(a==='tog'){if(S.starters.includes(id))S.starters=S.starters.filter(x=>x!==id);else if(S.starters.length<7)S.starters.push(id);else toast('Ya hay 7 titulares. Quita uno antes.')}
  else if(a==='del'){if(confirm('¿Borrar a '+pl(id).name+' de la plantilla?')){S.players=S.players.filter(p=>p.id!==id);S.starters=S.starters.filter(x=>x!==id)}}
  else if(a==='add'){const i=$('#newp'),n=i.value.trim();if(!n){toast('Escribe un nombre');return}S.players.push({id:'p'+(S.nid++),name:n,pos:'',conv:true});i.value=''}
  else if(a==='start'){
    const on=assign(S.starters,S.form);
    S.match={half:TEAMS[ALL.cur].half,roster:S.players.filter(p=>p.conv).map(p=>p.id),starters:S.starters.slice(),form0:S.form,form:S.form,onField:on,acc:{},since:Object.fromEntries(on.map(x=>[x,0])),
      ps:Object.fromEntries(on.map(x=>[x,0])),pm:{},base:0,runStart:0,running:false,part:1,p1End:null,sel:null,last:null,events:[],shots:[]};
    ALL.tab='match';
  }
  else if(a==='play'){if(m.running)pause();else{m.runStart=Date.now();m.running=true;try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}}
  else if(a==='next'){pause();const e=el();m.p1End=e;m.part=2;m.events.push({k:'part',t:e,part:2,min:m.half,add:0})}
  else if(a==='reset'){if(confirm('¿Reiniciar el partido? Se perderán los datos de este partido.')){S.match=null;DLG=null;ALL.tab='setup'}}
  else if(a==='out'){if(m.sel===id)m.sel=null;else if(m.sel){swapPos(m,m.sel,id);m.sel=null;try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}else m.sel=id}
  else if(a==='in'){
    if(!m.sel){toast('Toca primero a quien sale del campo');return}
    const e=el(),o=m.sel,i=m.onField.indexOf(o);
    m.acc[o]=(m.acc[o]||0)+(e-m.since[o]);stint(m,o,e);delete m.since[o];
    m.onField[i]=id;m.since[id]=e;m.ps[id]=e;
    m.events.push({k:'sub',t:e,...mark(m,e),entra:id,sale:o});m.sel=null;m.last=id;
    try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}
  }
  else if(a==='shot')DLG={k:'shot',lado:id,res:null,autor:null,asist:null};
  else if(a==='dres'){DLG.res=id;if(id!=='gol')DLG.asist=null}
  else if(a==='dpick'){const k=b.dataset.k;DLG[k]=DLG[k]===id?null:id;if(k==='autor'&&DLG.asist===id)DLG.asist=null}
  else if(a==='dsave'){
    const e=el(),d=DLG;
    m.shots.push({k:'shot',t:e,...mark(m,e),lado:d.lado,res:d.res,autor:d.autor,asist:d.res==='gol'?d.asist:null,por:d.lado==='contra'?m.onField[0]:null});
    DLG=null;try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}
  }
  else if(a==='dcancel')DLG=null;
  else if(a==='dels'){if(confirm('¿Quitar este evento?'))m.shots.splice(+id,1)}
  else if(a==='sug')changeForm(m,id);
  else if(a==='fin')DLG={k:'fin'};
  else if(a==='dfin'){const g=x=>Math.max(0,parseInt($(x).value,10)||0);finalize(($('#fr').value||'').trim(),g('#fg'),g('#fc'));DLG=null}
  else if(a==='delm'){const g=S.history.find(x=>String(x.id)===id);if(g&&confirm('¿Borrar el partido '+(g.rival||'sin rival')+' del '+new Date(g.date).toLocaleDateString('es-ES')+'? No se puede deshacer.'))S.history=S.history.filter(x=>String(x.id)!==id)}
  else if(a==='xl'){exportXlsx();return}
  else if(a==='csv'){exportCsv();return}
  else if(a==='json'){exportJson();return}
  else if(a==='imp'){$('#imp').click();return}
  save();render();
});
document.addEventListener('change',ev=>{
  const i=ev.target,a=i.dataset.a;if(!a)return;
  if(a==='form'){if(S.match&&ALL.tab==='match')changeForm(S.match,i.value);else S.form=i.value;save();render();return}
  const p=pl(i.dataset.id);if(!p)return;
  if(a==='ren'){const n=i.value.trim();if(!n){i.value=p.name;return}p.name=n;save()}

});
